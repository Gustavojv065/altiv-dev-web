name: ALTIV isolated browser QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Build isolated preview
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Start local Next server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/altiv-next.log 2>&1 &
          echo $! > /tmp/altiv-next.pid
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/login; then exit 0; fi
            sleep 2
          done
          cat /tmp/altiv-next.log
          exit 1
      - name: Browser smoke test (local-only)
        run: node -e "const { chromium } = require('playwright'); (async () => { const browser = await chromium.launch({headless:true}); const page = await browser.newPage(); const response = await page.goto('http://127.0.0.1:3000/login'); if (!response || response.status() >= 500) throw Error('Login route unavailable'); await browser.close(); })().catch(error => { console.error(error); process.exit(1) })"
